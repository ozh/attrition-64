<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>ATTRITION 64</title>
<meta name="description" content="A pixel breakout game where the paddle is an everyday item and the blocks form the silhouette of something that item is a threat to.">
<meta name="theme-color" content="#000000">

<link rel="icon" href="assets/icons/favicon.ico" sizes="32x32">
<link rel="icon" type="image/png" href="assets/icons/icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta property="og:url" content="https://ozh.github.io/attrition-64/">
<meta property="og:image" content="https://ozh.github.io/attrition-64/assets/icons/og-image.png">

<meta property="og:type" content="website">
<meta property="og:title" content="ATTRITION 64">
<meta property="og:description" content="A pixel breakout game where the paddle is an everyday item and the blocks form the silhouette of something that item is a threat to.">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="A cigarette paddle below a wall of lung-shaped pixel blocks.">
<!-- Twitter falls back to the og: tags for title, description and image. -->
<meta name="twitter:card" content="summary_large_image">
<style>
  html, body {
    margin: 0;
    height: 100%; /* Replaced at runtime by surroundColor() */
    background: #161616;
    overflow: hidden;
    overscroll-behavior: none;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding:
      env(safe-area-inset-top) env(safe-area-inset-right)
      env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  /* Canvas and the strip beneath it move as one block, so the strip is exactly
     as wide as the playfield whatever the scale factor works out to be. */
  .stage { display: flex; flex-direction: column; }
  #chrome {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 7px 1px 0;
    font: 11px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: rgba(255, 255, 255, 0.34);
    user-select: none;
  }
  #chrome a { color: inherit; text-decoration: none; }
  #chrome a:hover, #chrome a:focus-visible { color: rgba(255, 255, 255, 0.72); }
  #credit { text-align: right; }
  /* Fixed rather than a flex sibling: the canvas fit is computed from the
     viewport, so a panel that took layout space would shrink the game whenever
     debug was on. Hidden entirely unless config.DEBUG is set. */
  #debug {
    position: fixed;
    top: 0;
    right: 0;
    display: none;
    margin: 8px;
    padding: 8px 10px;
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 4px;
    background: rgba(0, 0, 0, 0.72);
    font: 11px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: rgba(255, 255, 255, 0.62);
    white-space: pre;
    pointer-events: none;
  }
  #debug b { color: rgba(255, 255, 255, 0.92); font-weight: normal; }
  canvas {
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    touch-action: none;      /* dragging the paddle must never scroll the page */
  }
  /* Applied by main.js only while a ball is in play — see CURSOR_HIDDEN_STATES.
     The paddle is the pointer then; on the title and result screens you are
     reading text, so the cursor comes back. */
  canvas.hide-cursor { cursor: none; }
</style>
</head>
<body>
  <div class="stage">
    <canvas id="game"></canvas>
    <div id="chrome">
      <a href="https://github.com/ozh/attrition-64" rel="noopener noreferrer"
         >github.com/ozh/attrition-64</a>
      <span id="credit"></span>
    </div>
  </div>
  <aside id="debug" aria-hidden="true"></aside>
  <script type="module" src="src/main.js"></script>
</body>
</html>
